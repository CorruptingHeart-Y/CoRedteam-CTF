    \     print(\"[-] No 'flag' parameter in request.\")\n        else:\n        \
    \    print(\"[-] No OOB request received within timeout.\")\n    except Exception\
    \ as e:\n        print(f\"[-] OOB error: {e}\")\n\n    print(\"STEP_OK\")\n\n\
