    \ or 80}\\r\\n\"\n            \n            # 构建头部\n            header_bytes =\
    \ request_line.encode() + host_header.encode()\n            for key, value in\
    \ headers.items():\n                header_bytes += f\"{key}: {value}\\r\\n\"\
    .encode()\n            header_bytes += b\"\\r\\n\"\n            \n           \
